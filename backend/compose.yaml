# MongoDB local de desarrollo: replica set de un nodo, necesario para transacciones.
# No es configuración operativa ni de alta disponibilidad.
name: kofi

services:
  mongo:
    image: mongo:8.0.34
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inicia el replica set la primera vez y después solo comprueba su estado.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status().ok } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
